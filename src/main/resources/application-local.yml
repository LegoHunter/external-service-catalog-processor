import-path: /dev/config

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: false
  defaults:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.bricklink.api: DEBUG

lego:
  minio:
    url: https://api.minio.dev.internal.legohunter.io
  bricklink:
    orders:
      sync:
        scheduled:
          enabled: true
          apply: true
    pricing:
      crawl:
        enabled: true
        batch-size: 100
        scheduled:
          enabled: true
      decision:
        enabled: true
        batch-size: 100
        scheduled:
          enabled: true
          initial-delay-ms: 5000
          fixed-delay-ms: 600000
  fulfillment:
    sync:
      scheduled:
        enabled: true
        apply: true

kafka:
  bootstrap-servers: redpanda-dev-0.dev.internal.legohunter.io:31092,redpanda-dev-1.dev.internal.legohunter.io:31092,redpanda-dev-2.dev.internal.legohunter.io:31092

bricklink:
  rest:
    http-logging:
      enabled: true
      include-headers: false
      include-body: true
