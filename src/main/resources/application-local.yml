import-path: /dev/config

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: false
  defaults:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.bricklink.api: DEBUG

lego:
  minio:
    url: https://api.minio.dev.internal.legohunter.io
  bricklink:
    orders:
      sync:
        scheduled:
          enabled: true
          apply: true
    pricing:
      crawl:
        enabled: true
        batch-size: 100
        scheduled:
          enabled: true
      decision:
        enabled: true
        batch-size: 100
        scheduled:
          enabled: true
          initial-delay-ms: 5000
          fixed-delay-ms: 600000
      apply-readiness:
        enabled: true
        batch-size: 100
        minimum-delta:
          enabled: true
          percent: 0.02
        minimum-confidence: 0.75
        minimum-comparable-count: 3
        maximum-absolute-delta: 50.00
        maximum-percent-delta: 0.50
        blocked-reason-codes:
          - OUTLIER_SPREAD_TOO_HIGH
          - NO_CURRENT_COMPARABLES
          - NO_EXACT_COMPARABLES
          - NO_CURRENT_SNAPSHOT
        scheduled:
          enabled: true
          initial-delay-ms: 10000
          fixed-delay-ms: 600000
      apply:
        enabled: true
        batch-size: 25
        mode: DRY_RUN
        environment-code: local
        scheduled:
          enabled: false
          initial-delay-ms: 30000
          fixed-delay-ms: 600000
    marketplace-sync:
      enabled: true
      mode: DRY_RUN
      environment-code: local
      production: false
      non-prod-stock-room-id: A
      scheduled:
        enabled: false
  fulfillment:
    sync:
      scheduled:
        enabled: true
        apply: true

kafka:
  bootstrap-servers: redpanda-dev-0.dev.internal.legohunter.io:31092,redpanda-dev-1.dev.internal.legohunter.io:31092,redpanda-dev-2.dev.internal.legohunter.io:31092

bricklink:
  rest:
    http-logging:
      enabled: true
      include-headers: false
      include-body: true
