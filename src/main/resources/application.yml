spring:
  profiles:
    default: local,sandbox
  application:
    name: Lego Data Ingress Service

lego:
  image-hosting:
    default-provider: flickr
    providers:
      flickr:
        enabled: true
        external-service-id: 10
        display-name: Flickr
        metrics-tag: flickr
    publishing:
      photo:
        title-template: "{captionOrFilename}"
        description-template: "{captionOrTitle}"
        tags: []
        public-flag: true
        friend-flag: false
        family-flag: false
        hidden: false
        safety-level: safe
    sync:
      external-service-id: 10
      retry:
        enabled: true
        max-attempts: 3
        initial-backoff-ms: 500
        backoff-multiplier: 2.0
        max-backoff-ms: 5000
      scheduled:
        enabled: false
        batch-size: 25
        concurrency: 5
        retry-failed: true
        apply: false
        fixed-delay-ms: 300000
        initial-delay-ms: 30000
        lock-at-most-for: 10m
        lock-at-least-for: 0s

kafka:
  bootstrap-servers: redpanda-dev-0.dev.internal.legohunter.io:31092,redpanda-dev-1.dev.internal.legohunter.io:31092,redpanda-dev-2.dev.internal.legohunter.io:31092
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: SCRAM-SHA-512
