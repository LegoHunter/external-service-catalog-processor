import-path: /etc/.credentials

spring:
  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,imageHostingKubernetesReadiness

  tracing:
    sampling:
      probability: 1.0

#  otlp:
#    tracing:
#      endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
#    metrics:
#      export:
#        url: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics

lego:
  minio:
    url: http://minio.minio-dev.svc.cluster.local
  image-hosting:
    readiness:
      require-scheduled-sync-enabled: true
