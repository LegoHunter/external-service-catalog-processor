import-path: /etc/.credentials

spring:
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: redpanda-dev.redpanda-dev.svc.cluster.local:9092

management:
  otlp:
    tracing:
      endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
    metrics:
      export:
        url:  http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted

otel:


lego:
  minio:
    url: http://minio.minio-dev.svc.cluster.local
