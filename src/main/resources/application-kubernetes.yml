import-path: /etc/.credentials

spring:
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: redpanda-dev.redpanda-dev.svc.cluster.local:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
    metrics:
      export:
        url: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics

lego:
  minio:
    url: http://minio.minio-dev.svc.cluster.local
