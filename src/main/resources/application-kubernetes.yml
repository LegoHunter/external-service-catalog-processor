import-path: /etc/.credentials

spring:
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: redpanda-dev.redpanda-dev.svc.cluster.local:9092

management:
  otlp:
    tracing:
      endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/tracees
    metrics:
      export:
        url:  http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: unrestricted
      enabled: true
    prometheus:
      access: unrestricted
      enabled: true

otel:
  exporter:
    otlp:
      endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  resource:
    attributes:
      service.version: 1.0.0
      deployment.environment: sandbox
  traces:
    exporter: otlp

lego:
  minio:
    url: http://minio.minio-dev.svc.cluster.local
