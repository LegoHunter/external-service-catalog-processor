import-path: /etc/.credentials

spring:
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: redpanda-dev.redpanda-dev.svc.cluster.local:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted

  metrics:
    export:
      otlp:
        enabled: true
        endpoint: http://otel-collector.observability.svc.cluster.local:4318

otel:
  traces:
    exporter: otlp
    endpoint: http://otel-collector.observability.svc.cluster.local:4317

lego:
  minio:
    url: http://minio.minio-dev.svc.cluster.local