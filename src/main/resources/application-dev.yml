spring:
  config:
    import:
      - file:${import-path}/database-configuration.yml
      - file:${import-path}/kafka-configuration.yml
      - file:${import-path}/minio-configuration.yml
      - file:${import-path}/flickr-configuration.yml
      - file:${import-path}/bitly-configuration.yml
      - file:${import-path}/bricklink-client-api-keys.yml
      - file:${import-path}/shipstation-configuration.yml
  datasource:
    database-key-name: rasppi5-01-lego-sandbox
    hikari:
      connection-timeout: 10000
      idle-timeout: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 40
      validation-timeout: 10000
      pool-name: rasppi5-01-mysql-jdbc-pool

lego:
  object-storage:
    buckets:
      final-photo: lego-photos-dev
  bricklink:
    orders:
      sync:
        scheduled:
          enabled: true
          apply: true
          fixed-delay-ms: 300000
    marketplace-sync:
      enabled: true
      mode: APPLY
      bricklink-external-service-id: 2
      batch-size: 5
      retry-backoff: 6h
      environment-code: dev
      production: false
      require-system-remarks-block: true
      non-prod-require-stock-room: true
      non-prod-stock-room-id: A
      remarks-max-length: 1024
      scheduled:
        enabled: true
        fixed-delay-ms: 600000
        initial-delay-ms: 300000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
  fulfillment:
    sync:
      scheduled:
        enabled: true
        apply: true
        fixed-delay-ms: 300000

kafka:
  bootstrap-servers: redpanda-dev-0.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-1.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-2.redpanda-dev.redpanda-dev.svc.cluster.local:9092
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: SCRAM-SHA-512
  consumer-defaults:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.consumer.username}' password='${lego.kafka.consumer.password}';"
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: true
  producer-defaults:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    retries: 10
    properties:
      spring.json.trusted.packages: "*"
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.producer.username}' password='${lego.kafka.producer.password}';"
      # Reduce noisy INFO logs from NetworkClient
      log.level.org.apache.kafka.clients.NetworkClient: WARN
      # Maximum time to wait for a request to complete
      request.timeout.ms: 60000
      # How long to wait for a broker connection before timing out
      max.block.ms: 60000
      # Enable idempotence to avoid duplicate messages on retries
      enable.idempotence: true
      # Backoff between retries
      retry.backoff.ms: 500
      # Reduce aggressive reconnect attempts on slow connections
      connections.max.idle.ms: 300000
      # Metadata refresh interval (longer interval reduces churn)
      metadata.max.age.ms: 300000
  topic-configuration:
    minio-s3:
      topics: dev-minio-s3-events
      consumer:
        group-id: dev-minio-s3-events-group
        properties:
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      producer:
        retries: 3
    upload-minio-s3:
      topics: dev-upload-photo, dev-delete-photo, dev-upload-bricklink-catalog, dev-upload-bricklink-category, dev-upload-rebrickable-catalog, dev-upload-rebrickable-theme
      producer:
        retries: 3
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    upload-photo:
      topic: dev-upload-photo
      consumer:
        group-id: dev-upload-photo-group
        concurrency: 1
        properties:
          max-poll-records: 1
          max-poll-interval-ms: 1800000
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    delete-photo:
      topic: dev-delete-photo
      consumer:
        group-id: dev-delete-photo-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectDeletedEvent
      producer:
        retries: 3
    upload-bricklink-catalog:
      topic: dev-upload-bricklink-catalog
      consumer:
        group-id: dev-upload-bricklink-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-bricklink-category:
      topic: dev-upload-bricklink-category
      consumer:
        group-id: dev-upload-bricklink-category-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-catalog:
      topic: dev-upload-rebrickable-catalog
      consumer:
        group-id: dev-upload-rebrickable-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-theme:
      topic: dev-upload-rebrickable-theme
      consumer:
        group-id: dev-upload-rebrickable-theme-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    photo-upload-entry:
      topic: dev-photo-upload-entry
      consumer:
        group-id: dev-photo-upload-entry-group
    bricklink-catalog-entry:
      topic: dev-bricklink-catalog-entry
      consumer:
        group-id: dev-bricklink-catalog-entry-group
      producer:
        retries: 3
    bricklink-category-entry:
      topic: dev-bricklink-category-entry
      consumer:
        group-id: dev-bricklink-category-entry-group
      producer:
        retries: 3
    rebrickable-catalog-entry:
      topic: dev-rebrickable-catalog-entry
      consumer:
        group-id: dev-rebrickable-catalog-entry-group
      producer:
        retries: 3
    rebrickable-theme-entry:
      topic: dev-rebrickable-theme-entry
      consumer:
        group-id: dev-rebrickable-theme-entry-group
      producer:
        retries: 3
