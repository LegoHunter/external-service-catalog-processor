spring:
  config:
    import:
      - file:${import-path}/database-configuration.yml
      - file:${import-path}/kafka-configuration.yml
      - file:${import-path}/minio-configuration.yml
      - file:${import-path}/flickr-configuration.yml
      - file:${import-path}/bitly-configuration.yml
      - file:${import-path}/bricklink-client-api-keys.yml
      - file:${import-path}/shipstation-configuration.yml
  datasource:
    database-key-name: rasppi5-01-lego-sandbox
    hikari:
      connection-timeout: 10000
      idle-timeout: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 40
      validation-timeout: 10000
      pool-name: rasppi5-01-mysql-jdbc-pool

lego:
  object-storage:
    buckets:
      final-photo: lego-photos-sandbox
  bricklink:
    pricing:
      crawl:
        enabled: true
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        catalog-item-type: S
        batch-size: 100
        worker-batch-size: 1
        results-per-page: 500
        max-attempts: 3
        crawl-cadence: 7d
        schedule-spread-window: 72h
        schedule-jitter: 30s
        retry-backoff: 6h
        claim-stale-after: 2h
        marketplace-listing-allowlist: []
        blackout:
          enabled: true
          zone-id: America/New_York
          start: "21:30"
          end: "08:30"
          weekdays-only: true
        scheduled:
          enabled: true
          fixed-delay-ms: 600000
          initial-delay-ms: 30000
          lock-at-most-for: 30m
          lock-at-least-for: 0s
      decision:
        enabled: true
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        batch-size: 100
        require-current-snapshot: true
        algorithm-version: bricklink-competitive-v1
        strategy-code: LEGACY_COMPETITIVE
        minimum-price:
        maximum-price:
        scheduled:
          enabled: true
          fixed-delay-ms: 600000
          initial-delay-ms: 120000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
      apply-readiness:
        enabled: true
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        proposed-decision-status-code: PROPOSED
        batch-size: 100
        minimum-price-delta: 0.01
        minimum-delta:
          enabled: true
          percent: 0.02
        minimum-confidence: 0.75
        minimum-comparable-count: 3
        maximum-absolute-delta: 50.00
        maximum-percent-delta: 0.50
        blocked-reason-codes:
          - OUTLIER_SPREAD_TOO_HIGH
          - NO_CURRENT_COMPARABLES
          - NO_EXACT_COMPARABLES
          - NO_CURRENT_SNAPSHOT
        apply-eligible-reason-codes:
          - SINGLE_COMPARABLE_DISCOUNTED
          - TWO_COMPARABLES_WEIGHTED
          - MEAN_PLUS_STDDEV
          - MATCHED_LOWEST_COMPETITOR
          - BELOW_MIN_PRICE_CLAMPED
          - ABOVE_MAX_PRICE_CLAMPED
        scheduled:
          enabled: true
          fixed-delay-ms: 600000
          initial-delay-ms: 180000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
      apply:
        enabled: true
        bricklink-external-service-id: 2
        batch-size: 25
        sync-request-max-attempts: 3
        mode: APPLY_LOCAL_AND_ENQUEUE_SYNC
        environment-code: sandbox
        scheduled:
          enabled: true
          fixed-delay-ms: 600000
          initial-delay-ms: 240000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
    marketplace-sync:
      enabled: true
      mode: APPLY
      bricklink-external-service-id: 2
      batch-size: 5
      retry-backoff: 6h
      environment-code: sandbox
      production: false
      require-system-remarks-block: true
      non-prod-require-stock-room: true
      non-prod-stock-room-id: C
      remarks-max-length: 1024
      scheduled:
        enabled: true
        fixed-delay-ms: 600000
        initial-delay-ms: 300000
        lock-at-most-for: 10m
        lock-at-least-for: 0s

kafka:
  bootstrap-servers: redpanda-dev-0.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-1.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-2.redpanda-dev.redpanda-dev.svc.cluster.local:9092
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: SCRAM-SHA-512
  consumer-defaults:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.consumer.username}' password='${lego.kafka.consumer.password}';"
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: true
  producer-defaults:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    retries: 10
    properties:
      spring.json.trusted.packages: "*"
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.producer.username}' password='${lego.kafka.producer.password}';"
      # Reduce noisy INFO logs from NetworkClient
      log.level.org.apache.kafka.clients.NetworkClient: WARN
      # Maximum time to wait for a request to complete
      request.timeout.ms: 60000
      # How long to wait for a broker connection before timing out
      max.block.ms: 60000
      # Enable idempotence to avoid duplicate messages on retries
      enable.idempotence: true
      # Backoff between retries
      retry.backoff.ms: 500
      # Reduce aggressive reconnect attempts on slow connections
      connections.max.idle.ms: 300000
      # Metadata refresh interval (longer interval reduces churn)
      metadata.max.age.ms: 300000
  topic-configuration:
    minio-s3:
      topics: sandbox-minio-s3-events
      consumer:
        group-id: sandbox-minio-s3-events-group
        properties:
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      producer:
        retries: 3
    upload-minio-s3:
      topics: sandbox-upload-photo, sandbox-delete-photo, sandbox-upload-bricklink-catalog, sandbox-upload-bricklink-category, sandbox-upload-rebrickable-catalog, sandbox-upload-rebrickable-theme
      producer:
        retries: 3
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    upload-photo:
      topic: sandbox-upload-photo
      consumer:
        group-id: sandbox-upload-photo-group
        concurrency: 1
        properties:
          max-poll-records: 1
          max-poll-interval-ms: 1800000
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    delete-photo:
      topic: sandbox-delete-photo
      consumer:
        group-id: sandbox-delete-photo-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectDeletedEvent
      producer:
        retries: 3
    upload-bricklink-catalog:
      topic: sandbox-upload-bricklink-catalog
      consumer:
        group-id: sandbox-upload-bricklink-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-bricklink-category:
      topic: sandbox-upload-bricklink-category
      consumer:
        group-id: sandbox-upload-bricklink-category-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-catalog:
      topic: sandbox-upload-rebrickable-catalog
      consumer:
        group-id: sandbox-upload-rebrickable-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-theme:
      topic: sandbox-upload-rebrickable-theme
      consumer:
        group-id: sandbox-upload-rebrickable-theme-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    photo-upload-entry:
      topic: sandbox-photo-upload-entry
      consumer:
        group-id: sandbox-photo-upload-entry-group
    bricklink-catalog-entry:
      topic: sandbox-bricklink-catalog-entry
      consumer:
        group-id: sandbox-bricklink-catalog-entry-group
      producer:
        retries: 3
    bricklink-category-entry:
      topic: sandbox-bricklink-category-entry
      consumer:
        group-id: sandbox-bricklink-category-entry-group
      producer:
        retries: 3
    rebrickable-catalog-entry:
      topic: sandbox-rebrickable-catalog-entry
      consumer:
        group-id: sandbox-rebrickable-catalog-entry-group
      producer:
        retries: 3
    rebrickable-theme-entry:
      topic: sandbox-rebrickable-theme-entry
      consumer:
        group-id: sandbox-rebrickable-theme-entry-group
      producer:
        retries: 3

bricklink:
  ajax:
    uri: https://www.bricklink.com
    rate-limit:
      enabled: true
      minimum-delay-ms: 2000
    http-logging:
      enabled: false
