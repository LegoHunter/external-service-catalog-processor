apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
spec:
  headers:
    browserXssFilter: true
    contentSecurityPolicy: >-
      default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src
      'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; connect-src
      'self' https:; frame-src 'self' https:; media-src 'self' https:; object-src 'none'; frame-ancestors
      'self'; base-uri 'self'; form-action 'self';
    contentTypeNosniff: true
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      X-Forwarded-Proto: https
    forceSTSHeader: true
    referrerPolicy: no-referrer
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
