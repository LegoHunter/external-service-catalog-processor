name: Build Test Deploy CronJob

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - closed

env:
  JOB_NAME: external-service-catalog-processor
  IMAGE_REPO: quay.io/tvattima/external-service-catalog-processor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.buildah-build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Build and deploy Maven snapshot
        run: mvn --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildah Build
        id: buildah-build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_REPO }}
          tags: ${{ github.sha }} snapshot latest
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile

      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/external-service-catalog-processor
          tags: ${{ steps.buildah-build.outputs.tags }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy CronJob
        run: |
          set -euo pipefail
          
          OVERLAY=""
          NAMESPACE=""
          IMAGE_TAG=""
          
          if [[ "${GITHUB_REF}" == refs/heads/feature/* ]]; then
            OVERLAY="sandbox"
            NAMESPACE="services-sandbox"
            IMAGE_TAG="snapshot"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            if [[ "${{ github.event.pull_request.base.ref }}" == "develop" ]]; then
              OVERLAY="dev"
              NAMESPACE="services-dev"
              IMAGE_TAG="${GITHUB_SHA}"
            elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
              OVERLAY="prod"
              NAMESPACE="services-prod"
              IMAGE_TAG="${GITHUB_SHA}"
            fi
          else
            echo "No deployment needed"
            exit 0
          fi
          
          echo "Deploying $JOB_NAME CronJob to $OVERLAY ($NAMESPACE)"
          
          # Build base + overlay patch, inject image
          # Build kustomize output and inject dynamic image tag
          KUSTOMIZE_OUTPUT=$(kubectl kustomize kubernetes/cronjobs/$JOB_NAME | \
          sed "s|$IMAGE_REPO:.*|$IMAGE_REPO:$IMAGE_TAG|g")
  
          echo "$KUSTOMIZE_OUTPUT" | kubectl apply -n $NAMESPACE -f -
          
          echo "CronJob deployed successfully"