name: Build Test Deploy CronJob

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - closed

jobs:

  # -----------------------------------------
  # 1️⃣ Maven Build & Deploy
  # -----------------------------------------
  maven-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Build and deploy Maven snapshot
        run: mvn --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------
  # 2️⃣ Container Build & Push
  # -----------------------------------------
  container-build:
    runs-on: ubuntu-latest
    needs: maven-build
    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.buildah-build.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Buildah Build
        id: buildah-build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-ingress
          tags: ${{ github.sha }} snapshot latest
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile

      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/lego-data-ingress
          tags: ${{ steps.buildah-build.outputs.tags }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  # -----------------------------------------
  # 3️⃣ Deploy
  # -----------------------------------------
  deploy:
    needs: container-build
    runs-on: [arc-runner]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Kustomize
        run: |
          set -euo pipefail

          OVERLAY=""
          NAMESPACE=""
          IMAGE_TAG=""

          if [[ "${GITHUB_REF}" == refs/heads/feature/* ]]; then
            OVERLAY="sandbox"
            NAMESPACE="services-sandbox"
            IMAGE_TAG="snapshot"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            if [[ "${{ github.event.pull_request.base.ref }}" == "develop" ]]; then
              OVERLAY="dev"
              NAMESPACE="services-dev"
              IMAGE_TAG="${GITHUB_SHA}"
            elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
              OVERLAY="prod"
              NAMESPACE="services-prod"
              IMAGE_TAG="${GITHUB_SHA}"
            fi
          else
            echo "No deployment needed for ref $GITHUB_REF"
            exit 0
          fi

          echo "Deploying overlay '$OVERLAY' to namespace '$NAMESPACE' with image tag '$IMAGE_TAG'"

          kubectl apply -k "kubernetes/overlays/$OVERLAY" -n "$NAMESPACE" --dry-run=client

          KUSTOMIZE_OUTPUT=$(kubectl kustomize "kubernetes/overlays/$OVERLAY" | \
            sed "s|quay.io/tvattima/lego-data-ingress:.*|quay.io/tvattima/lego-data-ingress:$IMAGE_TAG|g")

          echo "$KUSTOMIZE_OUTPUT" | kubectl apply -f -

          echo "Deployment complete!"