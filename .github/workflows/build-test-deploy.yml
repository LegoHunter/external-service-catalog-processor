name: Build Test Deploy CronJob

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - closed

jobs:

  # -----------------------------------------
  # 1️⃣ Maven Build & Deploy
  # -----------------------------------------
  maven-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Build and deploy Maven snapshot
        run: mvn --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # -----------------------------------------
  # 2️⃣ Container Build & Push
  # -----------------------------------------
  container-build:
    runs-on: ubuntu-latest
    needs: maven-build
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Buildah Build
        id: buildah-build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-ingress
          tags: ${{ github.sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile

      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/lego-data-ingress
          tags: ${{ github.sha }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  # -----------------------------------------
  # 3️⃣ Deploy
  # -----------------------------------------
  deploy:
    needs: container-build
    runs-on: [arc-runner]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Kustomize
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.container-build.outputs.image-tag }}"

          OVERLAY=""
          NAMESPACE=""

          if [[ "${GITHUB_REF}" == refs/heads/feature/* ]]; then
            OVERLAY="sandbox"
            NAMESPACE="services-sandbox"

          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then

            if [[ "${{ github.event.pull_request.base.ref }}" == "develop" ]]; then
              OVERLAY="dev"
              NAMESPACE="services-dev"

            elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
              OVERLAY="prod"
              NAMESPACE="services-prod"
            fi

          else
            echo "No deployment needed for ref $GITHUB_REF"
            exit 0
          fi

          echo "Deploying overlay '$OVERLAY' to namespace '$NAMESPACE' with image tag '$IMAGE_TAG'"

          # Ensure kustomize output uses correct image tag
          kubectl kustomize "kubernetes/overlays/$OVERLAY" \
            | sed "s|quay.io/tvattima/lego-data-ingress:.*|quay.io/tvattima/lego-data-ingress:$IMAGE_TAG|g" \
            | kubectl apply -n "$NAMESPACE" -f -

          # Force rollout if needed (guarantees update even if caching occurs)
          kubectl rollout restart deployment lego-data-ingress -n "$NAMESPACE"

          echo "Deployment complete!"